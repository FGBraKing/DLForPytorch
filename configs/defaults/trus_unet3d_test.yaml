---
# ---------------------------------------------------------------------------- #
# basic
# ---------------------------------------------------------------------------- #
name : 'trus_unet3d_DDP_SynBN_crop128_bs3x4_ch32_dc_adam_1e-4'
dataset_name : 'trus'
model_name : 'unet3d'
test_name : 'slide_test_pad_noaug'
visible_gpu : !!str "'0,''1,''2,''3'"
local_gpu : 3
DEBUG : False
deterministic : True

logs_dir : './traces/logs'
checkpoints_dir : './traces/checkpoints'
results_dir : './traces/results'

# dataset
dataroot : './traces/datasets/prostate_daf3d_pre'
phase : 'test'
crop_size : [128, 128, 128]
target_size : [128, 128, 128]
stride : [32, 32, 32]
no_augment : True

compute_pad : False

# dataloader
num_threads : 8
batch_size : 10

# ---------------------------------------------------------------------------- #
# module
# ---------------------------------------------------------------------------- #
# model
input_nc : 1
output_nc : 1
init_channel_number : 32
up_interpolate : False
conv_order : 'crb'
# ---------------------------------------------------------------------------- #
# model
# ---------------------------------------------------------------------------- #
weight_path : './traces/checkpoints/trus_unet3d_DDP_SynBN_crop128_bs3x4_ch32_dc_adam_1e-4/65_net_trus_unet3d_DDP_SynBN_crop128_bs3x4_ch32_dc_adam_1e-4.pth'
verbose : false
weight_dir  : './traces/checkpoints/trus_unet3d_DDP_SynBN_crop128_bs3x4_ch32_dc_adam_1e-4'
weight_on_dir : False

# ---------------------------------------------------------------------------- #
# test
# ---------------------------------------------------------------------------- #
eval : True
metric_names : ['dice', 'recall', 'precision', 'accuracy']
visual_names : ['segment', 'label', 'pad_volume']
save_visuals : True


# 'basic_metrics',
...


---
# ---------------------------------------------------------------------------- #
# basic
# ---------------------------------------------------------------------------- #
name : 'trus_unet3d_DDP_SynBN_crop128_bs3x4_ch32_dc_adam_1e-4'
dataset_name : 'trus'
model_name : 'unet3d'
predict_name : 'simple_predict'
visible_gpu : !!str "'0,''1,''2,''3'"
local_gpu : 1
DEBUG : False
deterministic : True

logs_dir : './traces/logs'
checkpoints_dir : './traces/checkpoints'
results_dir : './traces/results'

# dataset
dataroot : './traces/datasets/prostate_daf3d_pre'
phase : 'val'
custom : true
preprocess : 'resize'
#   'centercrop'
#    'resize'
#   'zoom_centercrop'
crop_size : [128, 128, 128]
target_size : [128, 128, 128]
order_data: 3
order_seg: 1
scale : [0.8, 0.8, 0.8]
revert : false

# dataloader
num_threads : 8
batch_size : 1

# ---------------------------------------------------------------------------- #
# module
# ---------------------------------------------------------------------------- #
# model
input_nc : 1
output_nc : 1
init_channel_number : 32
up_interpolate : False
conv_order : 'crb'
# ---------------------------------------------------------------------------- #
# model
# ---------------------------------------------------------------------------- #
weight_path : './traces/checkpoints/trus_unet3d_DDP_SynBN_crop12_bs4_ch32_dc_adam_1e-4/latest_net_trus_unet3d_DDP_SynBN_crop12_bs4_ch32_dc_adam_1e-4.pth'
verbose : false
weight_dir : './traces/checkpoints/trus_unet3d_DDP_SynBN_crop128_bs3x4_ch32_dc_adam_1e-4'
weight_on_dir : True

# ---------------------------------------------------------------------------- #
# test
# ---------------------------------------------------------------------------- #
eval : True
metric_names : ['basic_metrics', 'dice', 'recall', 'precision', 'accuracy']
visual_names : ['segment', 'label', 'volume']
save_visuals : False


# 'basic_metrics',
...


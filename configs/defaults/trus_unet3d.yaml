---
#'''
#三级配置文件----第二级
#提供特定的数据集和模型训练时所需要的参数，并提供一些不再改变的固定参数值
#'''

# ---------------------------------------------------------------------------- #
# basic
# ---------------------------------------------------------------------------- #
name : 'trus_unet3d_DDP_SynBN_gdacc2_crop128_bs3x4_ch32_kaiming_dc_adam_4e-4_step_0.25_warmup_10_1e-6'
# 规则：数据集名+网络名+训练策略+数据集参数+网络参数+学习率策略
# 训练策略： DDP/DP、SyncBatchNorm、use_mixed_precision、use_gradient_accumulation、APEX
dataset_name : 'trus'
model_name : 'unet3d'
gpu_ids : [0, 1, 2, 3, 4, 5, 6, 7]
visible_gpu : !!str "'0,''1,''2,''3'"
# '0,''1,''2,''3'
DEBUG : False
deterministic : True
# ---------------------------------------------------------------------------- #
# tricks
# ---------------------------------------------------------------------------- #
use_mixed_precision : False
use_gradient_accumulation : True
gradient_accumulation_k_step : 2
# DDP
DP : False
DDP : True
SyncBatchNorm : True
world_size : 4
rank : 0
local_rank : -1
dist_url : 'tcp://127.0.0.1:52000'
# 'env://'
# apex
# Apex
APEX : False
APEX_opt_level : 'O1'
# ---------------------------------------------------------------------------- #
# dataset
# ---------------------------------------------------------------------------- #
# dataset
dataroot : './traces/datasets/prostate_daf3d_pre'
phase : 'train'
serial_batches : true
custom : true
preprocess : 'randomscale_randomcrop_ranomrotate_centercrop_rot90_mirror_gaussianNoise_GaussianBlur_BrightnessMultiplicative_contrast_simulate_gammatransform'
crop_size : [128, 128, 128]
target_size : [128, 128, 128]
scale : [1., 1., 1.]
bright_mu : 0.1
bright_sigma : 0.5
elastic_alpha : [0., 1000]
elastic_sigma : [10., 13.]
shift_mu : [0., 1000]
shift_sigma : [10., 13.]

# dataloader
num_threads : 8
batch_size : 3
# ---------------------------------------------------------------------------- #
# module
# ---------------------------------------------------------------------------- #
# model
input_nc : 1
output_nc : 1
init_channel_number : 32
up_interpolate : False
conv_order : 'crb'
# 'crb'
# loss
reduction : 'mean'
ignore_index : ~
smooth : 0
# initialization
init_type : 'kaiming'
init_gain : 1.4142135623730951
init_std : 0.02
# ---------------------------------------------------------------------------- #
# optimizer
# ---------------------------------------------------------------------------- #
# optimizer
optimizer_name : adam
lr : 4e-4
weight_decay : 0
# scheduler
lr_policy : 'step'
decay_epochs : 25
decay_rate : 0.25
warmup_lr : 1e-6
warmup_epochs : 10
lr_noise : ~
# ---------------------------------------------------------------------------- #
# model
# ---------------------------------------------------------------------------- #
weight_path : './traces/checkpoints/......'
optimizer_path : ~
continue_train : false
verbose : false
# additional
suffix : ''
epoch_start : 1
num_epochs : 100
isTrain : True

# ---------------------------------------------------------------------------- #
# train
# ---------------------------------------------------------------------------- #
# network saving and loading
save_epoch_start : 1
save_epoch_freq : 1
save_iter_start : 50000
save_iter_freq : 500
save_by_iter : false
# network print and showing
display_freq : 40000
print_freq : 1
plot_freq : 1

val_epoch_freq : 1
test_on_train : True

# visualer
with_tensorboard : False
save_log : True
save_visuals : False

# ---------------------------------------------------------------------------- #
# test
# ---------------------------------------------------------------------------- #
eval : True
test_data_phase : 'test'
test_preprocess : 'resize'
# resize centercrop
test_batchsize : 4
test_scale : [0.8, 0.8, 0.8]






...